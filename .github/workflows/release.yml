name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bossbench
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bossbench"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # actions/setup-node installs a recent npm (>= 11.5.1) that supports
      # Trusted Publishing (OIDC) auto-detection. bun's bundled npm doesn't
      # reliably recognize the ACTIONS_ID_TOKEN_REQUEST_TOKEN env vars that
      # GitHub exposes when id-token: write is set, so npm publish then fails
      # with ENEEDAUTH even though changesets reports OIDC is available.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:integration
      - run: bun run build
      - uses: changesets/action@v1.9.0
        with:
          version: bun run version-packages
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publish uses npm Trusted Publishing (OIDC). The npm CLI auto-detects
          # GitHub Actions OIDC tokens from id-token: write. No NPM_TOKEN needed.
          # Each of the 13 @bossbench/* packages has a Trusted Publisher
          # configured on npmjs.com pointing at this workflow filename.
